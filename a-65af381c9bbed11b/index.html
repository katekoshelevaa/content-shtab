<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Архив публикаций</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#fff;--ink:#1c1c1c;--grey:#6e6964;--acc:#c8a882;--line:#e8e2d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--grey);margin:0 0 24px;font-size:14px}
h2{font-size:15px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:600;margin-right:6px}
.card h3{margin:10px 0 4px;font-size:18px}
.note{color:var(--grey);font-size:14px;margin:0 0 10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:8px 0}
.thumbs img,.thumbs video{height:130px;display:block;border-radius:10px;flex:0 0 auto;border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button,a.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:8px 14px;cursor:pointer;text-decoration:none}
button.main,a.main{background:var(--acc);border-color:var(--acc);color:#1c1c1c;font-weight:600}
.txt{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.txt b{display:block;font-size:13px;color:var(--grey);margin-bottom:4px}
.lb{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}.lb.on{display:flex}.lbtop{padding:12px 14px;border-bottom:1px solid var(--line)}.lbtop button{font-weight:600}.lbbody{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px}.lbbody img,.lbbody video{max-width:100%;max-height:100%;border-radius:12px}.lbbot{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}.thumbs img,.thumbs video{cursor:pointer}.cal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:18px}.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh b{font-size:17px;text-transform:capitalize}.calh button{padding:4px 12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.grid .wd{font-size:12px;color:var(--grey)}.day{padding:6px 0 4px;border-radius:10px;cursor:pointer;min-height:48px}.day.sel{background:#f3ece1}.day.today .n{background:var(--ink);color:#fff;border-radius:50%;display:inline-block;width:24px;height:24px;line-height:24px}.day.off{opacity:.35}.n{font-size:14px;display:inline-block}.dots{display:flex;gap:3px;justify-content:center;margin-top:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--grey);margin-top:10px}.legend span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.dayinfo{font-size:14px;margin-top:10px;white-space:pre-wrap}.stat{border-bottom:1px solid var(--line);padding:10px 0}.stat:last-child{border:0}.stat .v{font-size:22px;font-weight:700}.stat .dl{font-size:13px;margin-left:8px}.up{color:#2e9e5b}.down{color:#d44}.spark{display:block;margin-top:6px}.fb{font-size:13px;color:var(--grey);margin-top:4px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c1c1c;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.foot{color:var(--grey);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<main>
<h1>Архив публикаций</h1>
<p class="sub">История того, что я готовлю для Instagram* и Pinterest. Нажми «Скачать всё» или «Скопировать текст». Дату можно сказать Лии, она перенесёт карточку.</p>
<div id="cal"></div>
<div id="app"></div>
<div id="stats"></div>
<p class="foot">*Instagram принадлежит Meta, признанной в РФ экстремистской организацией.</p>
</main>
<div class="lb" id="lb"><div class="lbtop"><button id="lbBack">← Назад</button> <span id="lbCnt" style="color:var(--grey);margin-left:10px;font-size:14px"></span></div><div class="lbbody" id="lbBody"></div><div class="lbbot"><button class="main" id="lbSave">Сохранить в фотопленку</button><button id="lbDl">Скачать файл</button></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const TGW=(function(){try{return (window.Telegram&&window.Telegram.WebApp)||(window.parent&&window.parent.Telegram&&window.parent.Telegram.WebApp)||null}catch(e){return null}})();
function abs(f){return new URL('files/'+f,location.href).href}
function tgDl(f){try{if(TGW&&TGW.downloadFile){TGW.downloadFile({url:abs(f),file_name:f.split('/').pop()});return true}}catch(e){}return false}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Скопировано')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Скопировано')}}

let LBF=null,LBL=[],LBI=0;
function showLb(){const f=LBL[LBI];LBF=f;const b=$('#lbBody');b.innerHTML='';const e=document.createElement(isVid(f)?'video':'img');e.src='files/'+f;if(isVid(f)){e.controls=true;e.playsInline=true}b.appendChild(e);$('#lbCnt').textContent=LBL.length>1?(LBI+1)+' / '+LBL.length:'';}
function openLb(f,list){LBL=list||[f];LBI=Math.max(0,LBL.indexOf(f));showLb();$('#lb').classList.add('on');try{if(TGW&&TGW.BackButton){TGW.BackButton.show();TGW.BackButton.onClick(closeLb)}}catch(x){}}
function stepLb(n){if(LBL.length<2)return;LBI=(LBI+n+LBL.length)%LBL.length;showLb()}
function closeLb(){$('#lb').classList.remove('on');$('#lbBody').innerHTML='';LBF=null;try{if(TGW&&TGW.BackButton){TGW.BackButton.offClick(closeLb);TGW.BackButton.hide()}}catch(x){}}
async function saveLb(){
  if(!LBF)return;const f=LBF;
  try{const r=await fetch('files/'+f);const bl=await r.blob();const file=new File([bl],f.split('/').pop(),{type:bl.type||(isVid(f)?'video/mp4':'image/png')});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  if(tgDl(f)){toast('Скачивание запущено');return}
  toast('Нажми и удерживай картинку, затем «Сохранить»');
}
document.addEventListener('DOMContentLoaded',()=>{let sx=null;const bd=$('#lbBody');bd.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});bd.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)stepLb(dx<0?1:-1)});document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='ArrowRight')stepLb(1);if(e.key==='ArrowLeft')stepLb(-1);if(e.key==='Escape')closeLb()});$('#lbBack').onclick=closeLb;$('#lbSave').onclick=saveLb;$('#lbDl').onclick=()=>{if(LBF&&!tgDl(LBF)){const a=document.createElement('a');a.href='files/'+LBF;a.download=LBF.split('/').pop();a.click()}}});

const PC={instagram:'#e1306c',pinterest:'#e60023',momlife:'#f58529',telegram:'#2481cc',threads:'#111111'};
const PN={instagram:'Instagram*',pinterest:'Pinterest',momlife:'mom.life',telegram:'Telegram',threads:'Threads'};
function pkey(n){n=(n||'').toLowerCase();if(n.indexOf('pin')==0)return 'pinterest';if(n.indexOf('mom')==0)return 'momlife';if(n.indexOf('tele')==0)return 'telegram';if(n.indexOf('thr')==0)return 'threads';return 'instagram'}
let CAL={m:new Date(),sel:null,ev:[]};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderCal(){
  const c=$('#cal'),m=CAL.m,y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),off=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
  const names=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  let h='<div class="calh"><button id="cp">‹</button><b>'+names[mo]+' '+y+'</b><button id="cn">›</button></div><div class="grid">';
  ['пн','вт','ср','чт','пт','сб','вс'].forEach(w=>h+='<div class="wd">'+w+'</div>');
  for(let i=0;i<off;i++)h+='<div></div>';
  const td=iso(new Date());
  for(let d=1;d<=days;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const ev=CAL.ev.filter(e=>e.date===k);const cols=[...new Set(ev.map(e=>pkey(e.platform)))];
    h+='<div class="day'+(k===td?' today':'')+(k===CAL.sel?' sel':'')+'" data-k="'+k+'"><span class="n">'+d+'</span><div class="dots">'+cols.map(p=>'<i style="background:'+PC[p]+'"></i>').join('')+'</div></div>'}
  h+='</div><div class="legend">'+Object.keys(PC).map(p=>'<span><i style="background:'+PC[p]+'"></i>'+PN[p]+'</span>').join('')+'</div><div class="dayinfo" id="dayinfo"></div>';
  c.innerHTML=h;
  $('#cp').onclick=()=>{CAL.m=new Date(y,mo-1,1);renderCal()};$('#cn').onclick=()=>{CAL.m=new Date(y,mo+1,1);renderCal()};
  c.querySelectorAll('.day').forEach(e=>e.onclick=()=>{CAL.sel=e.dataset.k;renderCal();const ev=CAL.ev.filter(x=>x.date===CAL.sel);$('#dayinfo').textContent=fmt(CAL.sel)+(ev.length?'\n'+ev.map(x=>'• '+PN[pkey(x.platform)]+(x.title?': '+x.title:'')).join('\n'):'\nНичего не запланировано')});
}
function spark(vals){if(vals.length<2)return '';const w=240,h=40,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;const pts=vals.map((v,i)=>(i*(w/(vals.length-1))).toFixed(1)+','+(h-4-((v-mn)/r)*(h-8)).toFixed(1)).join(' ');return '<svg class="spark" width="'+w+'" height="'+h+'"><polyline fill="none" stroke="#c8a882" stroke-width="2.5" points="'+pts+'"/></svg>'}
function renderStats(s){
  const el=$('#stats');const en=(s&&s.entries)||[];
  let h='<h2>Статистика</h2><div class="card">';
  if(!en.length)h+='<p class="note">Пока пусто. Telegram и Threads я подтягиваю сама, по Instagram*, Pinterest и mom.life пришли мне цифры, я внесу.</p>';
  const keys=[...new Set(en.map(e=>e.platform+'|'+e.metric))];
  keys.forEach(k=>{const [p,m]=k.split('|');const L=en.filter(e=>e.platform===p&&e.metric===m).sort((a,b)=>a.date<b.date?-1:1);const last=L[L.length-1],prev=L[L.length-2];
    const num=typeof last.value==='number';let dl='';if(prev&&num&&typeof prev.value==='number'){const d=last.value-prev.value;dl='<span class="dl '+(d>0?'up':d<0?'down':'')+'">'+(d>0?'+':'')+d+'</span>'}
    h+='<div class="stat"><span class="tag" style="background:'+PC[pkey(p)]+'">'+(PN[pkey(p)])+'</span> '+m+'<div class="v">'+last.value+dl+'</div><div class="fb">'+fmt(last.date)+(last.note?' · '+last.note:'')+'</div>'+(num?spark(L.filter(e=>typeof e.value==='number').map(e=>e.value)):'')+'</div>'});
  h+='</div><p class="note">Instagram*, Pinterest и mom.life: присылай цифры Лии (подписчики, переходы, обратная связь), она добавит.</p>';
  el.innerHTML=h;
}
function isVid(f){return /\.(mp4|mov)$/i.test(f)}
function fmt(d){if(!d)return null;const [y,m,dd]=d.split('-');return dd+'.'+m+'.'+y}
async function zipAll(it){
  if(TGW&&TGW.downloadFile){it.files.forEach(f=>tgDl(f));return}
  if(!window.JSZip){toast('Скачай файлы по одному');return}
  toast('Собираю архив...');
  const z=new JSZip();
  for(const f of it.files){const r=await fetch('files/'+f);z.file(f.split('/').pop(),await r.blob())}
  it.texts.forEach((t,i)=>z.file('text-'+(i+1)+'.txt',t.label+'\n\n'+t.text));
  const b=await z.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=it.id+'.zip';a.click();
}
function card(it){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="tag" style="background:'+(it.platform.indexOf("Pinterest")==0?"#e60023":it.platform.indexOf("Telegram")==0?"#2481cc":it.platform.indexOf("mom")==0?"#f58529":"#e1306c")+'">'+it.platform+'</span><span class="tag" style="background:transparent;border:1px solid var(--line);color:var(--grey)">'+it.kind+'</span><h3></h3><p class="note"></p><div class="thumbs"></div><div class="btns"></div>';
  c.querySelector('h3').textContent=it.title;c.querySelector('.note').textContent=it.note||'';
  const th=c.querySelector('.thumbs');
  it.files.forEach(f=>{const w=document.createElement('div');w.style.cssText='position:relative;flex:0 0 auto;cursor:pointer';const e=document.createElement(isVid(f)?'video':'img');e.src='files/'+f+(isVid(f)?'#t=0.5':'');if(isVid(f)){e.preload='metadata';e.muted=true;e.playsInline=true;e.style.pointerEvents='none'}else{e.loading='lazy'}w.appendChild(e);if(isVid(f)){const pl=document.createElement('div');pl.textContent='▶';pl.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;text-shadow:0 0 8px #000';w.appendChild(pl)}w.onclick=()=>openLb(f,it.files);th.appendChild(w)});
  const bt=c.querySelector('.btns');
  const all=document.createElement('button');all.className='main';all.textContent='Скачать всё';all.onclick=()=>zipAll(it);bt.appendChild(all);
  it.files.forEach(f=>{const a=document.createElement('a');a.className='btn';a.href='files/'+f;a.download=f.split('/').pop();a.onclick=e=>{if(tgDl(f))e.preventDefault()};a.textContent='↓ '+f.split('/').pop();bt.appendChild(a)});
  it.texts.forEach(t=>{const d=document.createElement('div');d.className='txt';const b=document.createElement('b');b.textContent=t.label;d.appendChild(b);d.appendChild(document.createTextNode(t.text));
    const cb=document.createElement('button');cb.textContent='Скопировать текст';cb.style.marginTop='8px';cb.onclick=()=>copy(t.text);d.appendChild(document.createElement('br'));d.appendChild(cb);c.appendChild(d)});
  return c;
}
fetch('stats.json?t='+Date.now()).then(r=>r.json()).then(renderStats).catch(()=>renderStats(null));
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  CAL.ev=d.items.filter(i=>i.date).map(i=>({date:i.date,platform:i.platform,title:i.title})).concat((d.plan||[]).map(p=>({date:p.date,platform:p.platform,title:p.label||''})));renderCal();
  const app=$('#app');
  const groups={};d.items.forEach(i=>{(groups[i.date||'']=groups[i.date||'']||[]).push(i)});
  const keys=Object.keys(groups).sort((a,b)=>a===''?-1:b===''?1:a<b?-1:1);
  keys.forEach(k=>{const h=document.createElement('h2');h.textContent=k?fmt(k):'Готово, дата не назначена';app.appendChild(h);groups[k].forEach(i=>app.appendChild(card(i)))});
});
</script>
</body>
</html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Код</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;line-height:1.5}code{display:block;word-break:break-all;background:#f1f1f1;padding:12px;border-radius:8px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style></head>
<body><h2>Код авторизации</h2><p id="m">Ждём код...</p><code id="c"></code><button id="b" style="display:none">Копировать</button>
<script>
var p=new URLSearchParams(location.search),c=(p.get('code')||'').replace(/#_$/,''),e=p.get('error_description')||p.get('error');
if(c){document.getElementById('m').textContent='Скопируй код и пришли Лие:';document.getElementById('c').textContent=c;var b=document.getElementById('b');b.style.display='block';b.onclick=function(){navigator.clipboard.writeText(c).then(function(){b.textContent='Скопировано'})}}
else if(e){document.getElementById('m').textContent='Ошибка: '+e}else{document.getElementById('m').textContent='Кода нет. Открой ссылку авторизации от Лии.'}
</script></body></html>
